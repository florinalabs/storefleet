services:

  db:
    image: docker.io/library/mariadb:lts
    container_name: storefleet-db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - storefleet_db:/var/lib/mysql


  wordpress:
    image: docker.io/library/wordpress:php8.3-apache
    container_name: storefleet-wordpress
    restart: unless-stopped

    depends_on:
      - db

    ports:
      - "${WORDPRESS_PORT}:80"

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}

      STOREFLEET_INTERNAL_API_KEY: ${STOREFLEET_INTERNAL_API_KEY}

      WORDPRESS_CONFIG_EXTRA: |
        if (!defined('WP_ENVIRONMENT_TYPE')) {
            define(
                'WP_ENVIRONMENT_TYPE',
                'development'
            );
        }

        if (!defined('WP_DEBUG')) {
            define(
                'WP_DEBUG',
                true
            );
        }

        if (!defined('WP_DEBUG_LOG')) {
            define(
                'WP_DEBUG_LOG',
                true
            );
        }

        if (!defined('WP_DEBUG_DISPLAY')) {
            define(
                'WP_DEBUG_DISPLAY',
                false
            );
        }

        if (!defined('STOREFLEET_INTERNAL_API_KEY')) {
            define(
                'STOREFLEET_INTERNAL_API_KEY',
                getenv('STOREFLEET_INTERNAL_API_KEY')
            );
        }

    volumes:
      - storefleet_wordpress:/var/www/html
      - ./storefleet-marketplace:/var/www/html/wp-content/plugins/storefleet-marketplace:Z


  wpcli:
    image: docker.io/library/wordpress:cli-php8.3
    restart: "no"
    user: "33:33"

    depends_on:
      - db
      - wordpress

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}

      STOREFLEET_INTERNAL_API_KEY: ${STOREFLEET_INTERNAL_API_KEY}

    volumes:
      - storefleet_wordpress:/var/www/html
      - ./storefleet-marketplace:/var/www/html/wp-content/plugins/storefleet-marketplace:Z

    working_dir: /var/www/html


volumes:
  storefleet_db:
  storefleet_wordpress: